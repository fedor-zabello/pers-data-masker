syntax = "proto3";

package detect;

option java_package = "ru.cs.pers_data_masker.pydetect.proto";
option java_multiple_files = true;

service DetectService {
  rpc Detect (DetectRequest) returns (DetectResponse);
}

message DetectRequest {
  string text = 1;
}

message Span {
  int32 start = 1;
  int32 end = 2;
  string type = 3;
  float confidence = 4;
}

message DetectResponse {
  repeated Span spans = 1;
}