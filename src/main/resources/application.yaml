spring:
  application:
    name: pers-data-masker
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

pii:
  custom-types:
    - name: SNILS
      pattern: '\b\d{3}-\d{3}-\d{3} \d{2}\b'
      priority: 50
      masking:
        keep-start: 3
        keep-end: 2
        mask-char: '*'
        preserve-separators: true
    - name: CONTRACT_NUMBER
      pattern: '\b№\s?\d{4,8}\b'
      priority: 40
      context: [договор, контракт, contract]
      require-context: true
      context-window: 40
      masking:
        keep-start: 1
        keep-end: 2
        mask-char: '*'
        preserve-separators: true
    - name: PAYMENT_ACCOUNT
      pattern: '\b\d{13,19}\b'
      priority: 45
      checksum: luhn
      masking:
        keep-start: 4
        keep-end: 4
        mask-char: '*'
        preserve-separators: true
  systems:
    default:
      enabled: true
      demasking: true
      types: [FULL_NAME, BIRTH_DATE, BIRTH_PLACE, PASSPORT, CITIZENSHIP, PASSPORT_ISSUER,
              PASSPORT_DEPARTMENT_CODE, PASSPORT_ISSUE_DATE, DRIVER_LICENSE, MILITARY_ID,
              SEAMAN_PASSPORT, ADDRESS,
              REGISTRATION_ADDRESS, RESIDENCE_ADDRESS,
              EMAIL, PHONE, INN, CARD_NUMBER, CVV, PIN, CARD_HOLDER, SNILS, CONTRACT_NUMBER,
              PAYMENT_ACCOUNT]
    bank:
      enabled: true
      demasking: true
      types: [CARD_NUMBER, CVV, PIN, CARD_HOLDER, PHONE, EMAIL]
    hr:
      enabled: true
      demasking: true
      types: [FULL_NAME, BIRTH_DATE, BIRTH_PLACE, PASSPORT, CITIZENSHIP, PASSPORT_ISSUER,
              PASSPORT_DEPARTMENT_CODE, PASSPORT_ISSUE_DATE, DRIVER_LICENSE, MILITARY_ID,
              SEAMAN_PASSPORT, ADDRESS,
              REGISTRATION_ADDRESS, RESIDENCE_ADDRESS,
              INN, SNILS]
server:
  tomcat:
    max-swallow-size: 20MB
    max-http-form-post-size: 20MB
  servlet:
    context-path: /persmasker