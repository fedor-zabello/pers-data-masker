spring:
  application:
    name: pers-data-masker
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

pii:
  custom-types:
    - name: SNILS
      pattern: '\b\d{3}-\d{3}-\d{3} \d{2}\b'
      priority: 50
      masking:
        keep-start: 3
        keep-end: 2
        mask-char: '*'
        preserve-separators: true
  systems:
    default:
      enabled: true
      demasking: true
      types: [FULL_NAME, BIRTH_DATE, BIRTH_PLACE, PASSPORT, CITIZENSHIP, PASSPORT_ISSUER,
              PASSPORT_DEPARTMENT_CODE, PASSPORT_ISSUE_DATE, DRIVER_LICENSE, ADDRESS,
              EMAIL, PHONE, INN, CARD_NUMBER, CVV, PIN, CARD_HOLDER, SNILS]

pydetect:
  enabled: true
  url: http://localhost:8000
  timeout-ms: 1000
  type-mapping:
    PERSON: FULL_NAME
    BIRTH_DATE: BIRTH_DATE
    BIRTH_PLACE: BIRTH_PLACE
    PASSPORT: PASSPORT
    PASSPORT_SEPARATED: PASSPORT
    CITIZENSHIP: CITIZENSHIP
    PASSPORT_ISSUER: PASSPORT_ISSUER
    DIVISION_CODE: PASSPORT_DEPARTMENT_CODE
    PASSPORT_DATE: PASSPORT_ISSUE_DATE
    DRIVER_LICENSE: DRIVER_LICENSE
    ADDRESS: ADDRESS
    EMAIL: EMAIL
    PHONE: PHONE
    INN: INN
    CARD: CARD_NUMBER
    CVV: CVV
    PIN: PIN
    CARD_HOLDER: CARD_HOLDER